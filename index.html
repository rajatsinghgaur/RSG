<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rajat Singh Gaur | Developer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<style>

body{
margin:0;
font-family:Inter;
background:radial-gradient(circle at top,#0f2027,#050608);
color:white;
overflow:hidden;
}

/* NAVBAR */

nav{
position:absolute;
top:30px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 80px;
box-sizing:border-box;
z-index:2;
}

nav .logo{
font-weight:700;
letter-spacing:2px;
font-size:20px;
}

nav ul{
list-style:none;
display:flex;
gap:40px;
}

nav ul li{
cursor:pointer;
opacity:.8;
}

nav ul li:hover{
opacity:1;
}

/* HERO */

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* LEFT TEXT */

.left{
position:absolute;
left:120px;
}

.left h3{
color:#00e5ff;
font-weight:400;
}

.left h1{
font-size:65px;
line-height:1.1;
}

/* RIGHT TEXT */

.right{
position:absolute;
right:120px;
text-align:right;
}

.right h3{
color:#00e5ff;
font-weight:400;
}

.right h1{
font-size:65px;
}

/* SOCIAL */

.social{
position:absolute;
left:40px;
top:50%;
transform:translateY(-50%);
display:flex;
flex-direction:column;
gap:25px;
z-index:2;
}

.social a{
color:white;
font-size:22px;
text-decoration:none;
opacity:.7;
}

.social a:hover{
opacity:1;
}

/* 3D CANVAS */

#threeCanvas{
position:absolute;
width:500px;
height:500px;
}

/* GLOW TEXT */

h1{
background:linear-gradient(90deg,#00e5ff,#f5c518);
-webkit-background-clip:text;
color:transparent;
}

</style>

</head>

<body>

<nav>

<div class="logo">RSG</div>

<ul>
<li>ABOUT</li>
<li>WORK</li>
<li>CONTACT</li>
</ul>

</nav>

<div class="social">

<a href="https://github.com">GitHub</a>
<a href="https://linkedin.com">LinkedIn</a>
<a href="https://instagram.com">Instagram</a>

</div>

<section class="hero">

<div class="left">

<h3>Hello I'm</h3>
<h1>RAJAT<br>SINGH GAUR</h1>

</div>

<div id="threeCanvas"></div>

<div class="right">

<h3>Business Analytics</h3>
<h1>DEVELOPER</h1>

</div>

</section>

<script>

/* THREE JS SCENE */

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
75,
500/500,
0.1,
1000
)

const renderer = new THREE.WebGLRenderer({alpha:true})

renderer.setSize(500,500)

document.getElementById("threeCanvas").appendChild(renderer.domElement)

/* GEOMETRY */

const geometry = new THREE.IcosahedronGeometry(2,1)

const material = new THREE.MeshStandardMaterial({
color:0x00e5ff,
wireframe:true
})

const sphere = new THREE.Mesh(geometry,material)

scene.add(sphere)

/* LIGHT */

const light = new THREE.PointLight(0xffffff,1)

light.position.set(5,5,5)

scene.add(light)

camera.position.z = 5

/* ANIMATION */

function animate(){

requestAnimationFrame(animate)

sphere.rotation.x += 0.01
sphere.rotation.y += 0.01

renderer.render(scene,camera)

}

animate()

</script>

</body>
</html>
