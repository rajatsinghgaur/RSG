<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skills | Rajat Singh Gaur</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Inter;
background:linear-gradient(180deg,#05060a,#0d1117);
color:white;
overflow-x:hidden;
}

header{
display:flex;
justify-content:space-between;
padding:25px 80px;
align-items:center;
}

.logo{
font-weight:700;
font-size:22px;
}

nav a{
color:#aaa;
text-decoration:none;
margin-left:30px;
transition:0.3s;
}

nav a:hover{
color:white;
}

.hero{
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:50px;
background:linear-gradient(90deg,#00f0ff,#8a2eff);
-webkit-background-clip:text;
color:transparent;
}

.hero p{
color:#aaa;
margin-top:10px;
}

.skills{
max-width:1100px;
margin:auto;
padding:40px 20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.skill-card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
padding:25px;
border-radius:15px;
backdrop-filter:blur(10px);
transition:0.4s;
}

.skill-card:hover{
transform:translateY(-10px);
border-color:#00eaff;
}

.skill-title{
font-size:20px;
margin-bottom:15px;
}

.progress{
background:#111;
height:8px;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:linear-gradient(90deg,#00eaff,#6a00ff);
width:0%;
animation:load 2s forwards;
}

@keyframes load{
from{width:0}
}

footer{
text-align:center;
padding:40px;
color:#777;
font-size:14px;
}

</style>

</head>

<body>
